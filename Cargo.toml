[package]
name = "translator"
version = "0.1.0"
edition = "2024"

[dependencies]
# Графы и структуры данных
petgraph = { version = "0.7", features = ["serde-1"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Сериализация
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Обработка ошибок
thiserror = "2.0"
anyhow = "1.0"

# Логирование
tracing = "0.1"
tracing-subscriber = "0.3"
