[package]
name = "translator-app"
version = "0.2.1"
description = "Universal Game Localization & Translation Tool"
authors = ["Anton Kazakov"]
edition = "2024"

[lib]
name = "translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Графы и структуры данных
petgraph = { version = "0.7", features = ["serde-1"] }
uuid = { version = "1.10", features = ["v4", "serde", "v7"] }
rayon = "1.10"
parking_lot = "0.12"

# Сериализация
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Обработка ошибок
thiserror = "2.0"
anyhow = "1.0"

# Логирование
tracing = "0.1"

# Парсинг
regex = "1.11"
flate2 = "1.0"

# Сеть и LLM
reqwest = { version = "0.12", features = ["json"] }
md5 = "0.7"

# Хранилище 2.0
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
sha2 = "0.11"

# Ключи API в хранилище ОС
keyring = "4"

# Сравнение имён (NameKey)
unicode-normalization = "0.1"
caseless = "0.2"

# Типы TypeScript для окна из Rust
tauri-specta = { version = "=2.0.0-rc.26", features = ["typescript"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3"
