[package]
name = "translator-app"
version = "0.1.0"
description = "Universal Game Localization & Translation Tool"
authors = ["Anton Kazakov"]
edition = "2024"

[lib]
name = "translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

# Графы и структуры данных
petgraph = { version = "0.7", features = ["serde-1"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.10"
parking_lot = "0.12"

# Сериализация
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Обработка ошибок
thiserror = "2.0"
anyhow = "1.0"

# Логирование
tracing = "0.1"
tracing-subscriber = "0.3"

# Парсинг
regex = "1.11"
flate2 = "1.0"
walkdir = "2.5"

# Сеть и LLM
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
